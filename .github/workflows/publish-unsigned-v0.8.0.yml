name: Publish approved unsigned v0.8.0
on:
  push:
    branches: [release/publish-v0.8.0]
    paths:
      - '.github/workflows/publish-unsigned-v0.8.0.yml'
      - 'scripts/publish-unsigned-v0.8.0.py'
      - 'docs/RELEASE_V0.8.0.md'
permissions:
  contents: read
concurrency:
  group: publish-unsigned-v0.8.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'dievanessasophie-sketch/SiriModManager'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the approved build and publish its unsigned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dievanessasophie-sketch/SiriModManager
        run: python3 scripts/publish-unsigned-v0.8.0.py
